version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: benchline
      POSTGRES_USER: benchline
      POSTGRES_PASSWORD: benchline
    volumes:
      - benchline_pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      SECRET_KEY: dev-secret-change-me
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      USE_SQLITE: "False"
      # Explicitly point at the local Postgres container started above.
      # Without this, the backend would fall back to its built-in default —
      # the shop's hosted Render database — which isn't what you want for
      # local docker-compose development. Override this to the Render URL
      # (or any other database) if you ever want this stack talking to it.
      DATABASE_URL: "postgresql://benchline:benchline@db:5432/benchline"
      DB_SSL_REQUIRE: "False"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000"
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  benchline_pg_data:
